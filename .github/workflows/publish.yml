# Copied from house 0.1.0. Change it in house, then copy it out again.
# Runs on the GitHub mirror when a version tag is pushed (`git push origin v0.1.2`
# reaches Codeberg and the mirror at once). npm trusts this workflow by name
# (trusted publishing), so there is no token and no sign-in. On npmjs.com the
# trusted publisher must have "Allow npm publish" ticked.
#
# Two jobs, so that no code from a dependency runs where the publish token can be
# minted: `check` installs, runs the gate and packs the package; `publish` alone
# holds id-token: write, installs nothing, and publishes that tarball.
# Actions are pinned by commit, with the release in a comment.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: the tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      # npm refuses a version it already holds, but only once the gate has run: say so first.
      - name: the version is not on npm yet
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm: bump the version, then tag again."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: purity names
        env:
          PURITY_NAMES: ${{ secrets.PURITY_NAMES }}
        run: |
          if [ -n "$PURITY_NAMES" ]; then
            printf '%s\n' "$PURITY_NAMES" > "$RUNNER_TEMP/purity-names"
            echo "TOGHEN_PURITY_NAMES=$RUNNER_TEMP/purity-names" >> "$GITHUB_ENV"
          fi
      - run: pnpm check
      # The gate has built everything, so packing runs no script again (figma's
      # prepack is the gate itself).
      - run: mkdir -p "$RUNNER_TEMP/package" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checked out for .node-version only: nothing from the repository runs here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No pnpm here, so setup-node must not cache by package.json's packageManager.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships one. No
      # provenance: npm would want package.json's repository to name the mirror,
      # and the repository is Codeberg. A tarball is published as packed: no
      # lifecycle script runs.
      - run: npm publish package/*.tgz --access public --provenance=false
