# Copied from house 0.1.0. Change it in house, then copy it out again.
# Runs on the GitHub mirror when a version tag is pushed (`git push origin v0.1.2`
# reaches Codeberg and the mirror at once). npm trusts this workflow by name
# (trusted publishing), so there is no token and no sign-in, and each version
# records the commit it was built from.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: the tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - name: purity names
        env:
          PURITY_NAMES: ${{ secrets.PURITY_NAMES }}
        run: |
          if [ -n "$PURITY_NAMES" ]; then
            printf '%s\n' "$PURITY_NAMES" > "$RUNNER_TEMP/purity-names"
            echo "TOGHEN_PURITY_NAMES=$RUNNER_TEMP/purity-names" >> "$GITHUB_ENV"
          fi
      - run: pnpm check
      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships one.
      - run: npm publish --access public
