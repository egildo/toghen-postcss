<!doctype html><html lang="en"><head>
<style>
@layer tokens{@layer defaults{:root{--color-bg:var(--lightningcss-light,#fff)var(--lightningcss-dark,#000);--color-text:var(--lightningcss-light,#1a1a1a)var(--lightningcss-dark,#e6e6e6)}}@layer theme;}.c{background-color:var(--color-bg,#fff);color:var(--color-text,#1a1a1a)}
</style>
<style>
:root { color-scheme: light dark; }
.dark { color-scheme: dark; }
.light { color-scheme: light; }
</style>
</head><body>
<div id="root"><span class="c" id="r">x</span></div>
<div class="dark"><span class="c" id="d">x</span></div>
<div class="light"><span class="c" id="l">x</span></div>
</body></html>
